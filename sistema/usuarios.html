<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários | Sistema Acadêmico</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="usuarios">

  <header class="header">
    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">🎓</div>
        <span>Sistema Acadêmico</span>
      </div>
      <nav class="nav">
        <a href="index.html" data-page="dashboard">Dashboard</a>
        <a href="alunos.html" data-page="alunos">Alunos</a>
        <a href="cursos.html" data-page="cursos">Cursos</a>
        <a href="matriculas.html" data-page="matriculas">Matrículas</a>
        <a href="usuarios.html" data-page="usuarios">Usuários</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <h1 class="page-title">Usuários</h1>
    <p class="page-subtitle">Gerenciamento de usuários do sistema</p>

    <div id="alerta" class="alert"></div>

    <div class="section">
      <div class="section-header">
        <h2 class="section-title">Lista de Usuários</h2>
        <div class="toolbar">
          <button class="btn btn-primary" id="btn-novo-usuario">+ Novo Usuário</button>
        </div>
      </div>

      <div class="toolbar" style="margin-bottom: 1.25rem;">
        <div class="search-box">
          <input type="text" id="busca-usuario" placeholder="Buscar por nome ou e-mail...">
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Perfil</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-usuarios">
            <!-- Preenchido via JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="footer">
    Sistema de Gerenciamento Acadêmico &mdash; Programação Web I &mdash; 2026
  </footer>

  <!-- Modal Usuário -->
  <div class="modal-overlay" id="modal-usuario">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-usuario-titulo">Novo Usuário</h3>
        <button class="modal-close" data-close="modal-usuario">&times;</button>
      </div>
      <form id="form-usuario">
        <div class="modal-body">
          <input type="hidden" id="usuario-id">
          <div class="form-grid">
            <div class="form-group">
              <label for="usuario-nome">Nome completo *</label>
              <input type="text" id="usuario-nome" required placeholder="Ex: Maria Silva">
            </div>
            <div class="form-group">
              <label for="usuario-email">E-mail *</label>
              <input type="email" id="usuario-email" required placeholder="Ex: maria@email.com">
            </div>
            <div class="form-group">
              <label for="usuario-perfil">Perfil *</label>
              <select id="usuario-perfil" required>
                <option value="">Selecione</option>
                <option value="admin">Admin</option>
                <option value="secretario">Secretário</option>
                <option value="coordenador">Coordenador</option>
              </select>
            </div>
            <div class="form-group">
              <label for="usuario-status">Status</label>
              <select id="usuario-status">
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close="modal-usuario">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/dados.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
